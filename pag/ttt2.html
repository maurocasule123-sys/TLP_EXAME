<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <title>I Trimestre</title>

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }
    
    .header {
        position: sticky;
        top: 0;
        background: #4c5156;
        padding: 15px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header h1 a {
        color: #fff;
        text-decoration: none;
    }

    nav {
        display: flex;
        gap: 10px;
      
    }

    nav a {
        text-decoration: none;
        padding: 8px 16px;
        background: #111111;
        color: #fff;
        border-radius: 6px;
        font-weight: bold;
        align-items: center;
    }

  
    main {
        padding: 40px;
    }

    .trimestre-box {
      
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .trimestre-box h2 {
        margin-bottom: 25px;
        color: #000000;
    }

  
    .trabalhos {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }

    .trabalhos a {
        padding: 15px 20px;
        background: #060606;
        color: #fff;
        text-decoration: none;
        font-weight: bold;
        border-radius: 8px;
        transition: 0.3s;
    }

    .trabalhos a:hover {
        background: #38f848;
        color: #000;
    }
    .button{
    padding:10px 18px;
    border-radius:20px;
    border:1px solid #334155;
    background:blue;
    color:white;
    margin-left:10px;
    cursor:pointer;
    }

    .button:hover{
    
    border-radius:20px;
    border:1px solid #0369f7;
    background:transparent;
    color:white;
    cursor:pointer;
    }
  </style>
</head>

<body>

    <header class="header">
    <h1><a href="../index.html">HOME</a></h1>
    <div class="nav-btns">
      <a href="ttt1.html" class="button">T1</a>
      <a href="ttt2.html" class="button">T2</a>
    </div>

    <nav>
        <a href="trimestre1.html">Iº Trim.</a>
        <a href="trimestre2.html">IIº Trim.</a>
        <a href="trimestre3.html">IIIº Trim.</a>
    </nav>
    </header>

    <div>
        <h2>Tabela de Classificação</h2>
            <table class="table table-striped table-hover shadow">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th><th>Número</th><th>Sala</th><th>Turma</th><th>Disciplina</th>
                        <th>Nota 1</th><th>Nota 2</th><th>Nota 3</th><th>Média</th><th>Classificação</th>
                    </tr>
            </thead>
            <tbody id="tabela"></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const alunos = JSON.parse(localStorage.getItem("alunos")) || [];
        let html = "";

        alunos.forEach(aluno => {
            const me = ((aluno.not1 + aluno.not2 + aluno.not3) / 3).toFixed(2);
            let classificacao = me >= 7 ? "Aprovado" : me >= 5 ? "Recuperação" : "Reprovado";

            html += `
            <tr>
                <td>${aluno.nome}</td>
                <td>${aluno.numero}</td>
                <td>${aluno.numero}</td>
                <td>${aluno.turma}</td>
                <td>${aluno.disciplina}</td>
                <td>${aluno.not1}</td>
                <td>${aluno.not2}</td>
                <td>${aluno.not3}</td>
                <td>${me}</td>
                <td>${classificacao}</td>
            </tr>
            `;
        });

        document.getElementById("tabela").innerHTML = html;
    </script>
</body>
</html>
