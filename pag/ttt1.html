<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <title>I Trimestre</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background: #4c5156;
    }

    
    .header {
      position: sticky;
      top: 0;
      
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 a {
      color: #fff;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 10px;
      
    }

    nav a {
      text-decoration: none;
      padding: 8px 16px;
      background: #111111;
      color: #fff;
      border-radius: 6px;
      font-weight: bold;
      align-items: center;
    }

  
    main {
      padding: 40px;
    }

    .trimestre-box {
      
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .trimestre-box h2 {
      margin-bottom: 25px;
      color: #000000;
    }

  
    .trabalhos {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .trabalhos a {
      padding: 15px 20px;
      background: #060606;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: 0.3s;
    }

    .trabalhos a:hover {
      background: #38f848;
      color: #000;
    }
    .button{
    padding:10px 18px;
    border-radius:20px;
    border:1px solid #334155;
    background:blue;
    color:white;
    margin-left:10px;
    cursor:pointer;
    }

    .button:hover{
    
    border-radius:20px;
    border:1px solid #0369f7;
    background:transparent;
    color:white;
    cursor:pointer;
    }
  </style>
</head>

<body>
  
  <header class="header">
    <h1><a href="../index.html">HOME</a></h1>
    <div class="nav-btns">
      <a href="ttt1.html" class="button">T1</a>
      <a href="ttt2.html" class="button">T2</a>
    </div>
    
    <nav>
      <a href="trimestre1.html">Iº Trim.</a>
      <a href="trimestre2.html">IIº Trim.</a>
      <a href="trimestre3.html">IIIº Trim.</a>
    </nav>
  </header>
  
  <div>
    <h2>Insira os dados do aluno</h2>
    <form id="alunoForm" class="bg-light p-4 rounded shadow">
      <div class="mb-2"><label class="form-label">Nome</label><input type="text" class="form-control" id="nome" required></div>
      <div class="mb-2"><label class="form-label">Número</label><input type="text" class="form-control" id="numeroAluno" required></div>
      <div class="mb-2"><label class="form-label">Sala</label><input type="text" class="form-control" id="numeroSala" required></div>
      <div class="mb-2"><label class="form-label">Turma</label><input type="text" class="form-control" id="turma" required></div>
      <div class="mb-2"><label class="form-label">Disciplina</label><input type="text" class="form-control" id="disciplina" required></div>
      <div class="mb-2"><label class="form-label">Nota 1</label><input type="number" class="form-control" id="nota1" required></div>
      <div class="mb-2"><label class="form-label">Nota 2</label><input type="number" class="form-control" id="nota2" required></div>
      <div class="mb-2"><label class="form-label">Nota 3</label><input type="number" class="form-control" id="nota3" required></div>
      <button type="submit" class="btn btn-success">Salvar</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
      document.getElementById("alunoForm").addEventListener("submit", function(e){
        e.preventDefault();
        const aluno = {
            nome: nome.value,
            numero: numero.value,
            numero: numero.value,
            turma: turma.value,
            disciplina: disciplina.value,
            nota1: parseFloat(not1.value),
            nota2: parseFloat(not2.value),
            nota3: parseFloat(nota.value)
        };
        localStorage.setItem("aluno", JSON.stringify(aluno));
        window.location.href = "ttt2.html";

            // Recupera lista existente ou cria nova
        let alunos = JSON.parse(localStorage.getItem("alunos")) || [];
        alunos.push(aluno);

        // Salva lista atualizada
        localStorage.setItem("alunos", JSON.stringify(alunos));

        window.location.href = "ttt2.html";
  });
  </script>
</body>
</html>
